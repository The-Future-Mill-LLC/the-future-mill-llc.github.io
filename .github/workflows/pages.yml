# Publishes The Future Mill LLC website (privacy policy) and, every 15 minutes, 405 Live's traffic file (the405/live.json).
# The TomTom key lives in this repository's Actions secrets as TOMTOM_KEY; without it the site still publishes.
name: Publish site and 405 Live traffic

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch live 405 traffic
        # a TomTom hiccup must not stop the privacy page publishing; the game falls back to the usual pattern
        continue-on-error: true
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: node scripts/live405.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
